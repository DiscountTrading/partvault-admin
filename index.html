<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PartVault Admin</title>
  <meta name="theme-color" content="#F5F4F0" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; }
    body { background: #F5F4F0; color: #17150F; font-family: 'Inter', system-ui, sans-serif; }
    input, select, textarea, button { font-family: inherit; }
    ::-webkit-scrollbar { width: 7px; height: 7px; }
    ::-webkit-scrollbar-track { background: #ede9e0; }
    ::-webkit-scrollbar-thumb { background: #c8c3b8; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #BD400B; }
    .spin { animation: spin 1s linear infinite; display: inline-block; }
    @keyframes spin { from { transform: rotate(0deg) } to { transform: rotate(360deg) } }
    /* Phones, every screen at once: iOS Safari zooms the whole page the moment a
       field smaller than 16px takes focus, and a control under 44pt is hard to
       hit. Set both floors here so no individual form has to remember. */
    @media (max-width: 640px) {
      /* !important because nearly every field carries an inline font-size from
         the shared style tokens, and an inline style beats a plain rule. */
      input:not([type="checkbox"]):not([type="radio"]), select, textarea {
        font-size: 16px !important;
        min-height: 44px;
      }
      /* Same floor for buttons. Add class="pv-compact" to opt one out — e.g. a
         chip that is decoration next to a real control, never the tap target. */
      button:not(.pv-compact) { min-height: 44px; }
    }
    /* Column layouts (the part form, the settings pages). A card is one object:
       a column break through the middle of it separates a control from its label
       and reads as a rendering fault, not a layout. Applied to every child of the
       container rather than to each card, because the cards are styled a dozen
       different ways and the next one added would silently be missed. */
    .pv-cols > * { break-inside: avoid; -webkit-column-break-inside: avoid; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
